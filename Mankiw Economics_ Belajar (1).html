<!DOCTYPE html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Mankiw Economics: Belajar</title>
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Barlow:wght@400;500;600&display=swap" rel="stylesheet">
<style>
:root{color-scheme:dark;--bg:#06080A;--s1:#0F1418;--s2:#171F25;--ln:#25323B;--tx:#EAF3F4;--mu:#8EA2A9;--cy:#00D2BE;--cyd:#073A36;--no:#FF5A5F;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
*{box-sizing:border-box}html,body{margin:0;background:var(--bg)}body{color:var(--tx);font:16px/1.55 Barlow,system-ui,sans-serif}
h1,h2,h3,.h,button{font-family:"Chakra Petch","Segoe UI",sans-serif}
.w{max-width:480px;margin:0 auto;padding:18px 18px 40px;min-height:100vh}
.top{display:flex;align-items:center;gap:12px;margin-bottom:14px}.ic{background:none;border:1px solid var(--ln);color:var(--tx);width:38px;height:38px;border-radius:10px;font-size:18px;cursor:pointer}
.top .t{flex:1;font-size:14px;color:var(--mu);line-height:1.2}
.logo{width:38px;height:38px;border-radius:10px;background:var(--cy);color:#021311;display:grid;place-items:center;font:700 16px "Chakra Petch"}
.bar{height:5px;background:var(--s2);border-radius:9px;overflow:hidden}.bar i{display:block;height:100%;background:var(--cy);border-radius:9px;transition:width .25s}
.hi{font-size:26px;margin:6px 0 2px}.mu{color:var(--mu);font-size:14px}
.st{display:flex;gap:10px;margin:14px 0}.st div{flex:1;background:var(--s1);border:1px solid var(--ln);border-radius:12px;padding:10px 12px}.st b{display:block;font:600 22px "Chakra Petch";color:var(--cy)}
.lc{display:block;width:100%;text-align:left;background:var(--s1);border:1px solid var(--ln);border-left:4px solid var(--cy);border-radius:12px;padding:14px;margin-top:10px;color:var(--tx);cursor:pointer}
.lc:hover{background:var(--s2)}.lc .h{font-size:17px;font-weight:600}.lc .bar{margin-top:10px}.lk{opacity:.5;border-left-color:var(--ln);cursor:default}
.card{background:var(--s1);border:1px solid var(--ln);border-radius:16px;padding:20px;margin-top:14px}.card h2{font-size:22px;line-height:1.2;margin:2px 0 6px}.lead{color:var(--mu);margin:0 0 12px}
ul{list-style:none;padding:0;margin:0}li{position:relative;padding:8px 0 8px 22px;border-top:1px solid var(--ln)}li:before{content:"";position:absolute;left:2px;top:15px;width:8px;height:8px;background:var(--cy);transform:skewX(-20deg)}
b{color:var(--cy);font-weight:600}i{color:#CFE3E6}
figure{margin:14px 0 0}figure img{width:100%;border-radius:10px;background:#fff}figcaption{font-size:13px;color:var(--mu);margin-top:6px}
.nav{display:flex;gap:10px;margin-top:16px}.nav button,.pr{flex:1;border:0;border-radius:12px;padding:13px;font-size:16px;font-weight:600;cursor:pointer;background:linear-gradient(90deg,#00B5A5,#00E8D2);color:#031412}
.nav .g{background:var(--s2);color:var(--tx);border:1px solid var(--ln)}.nav button:disabled{opacity:.35;cursor:default}
button:focus-visible{outline:3px solid #fff;outline-offset:2px}
.tabs{display:flex;gap:8px;margin:0 0 4px}.tabs button{flex:1;padding:9px;border-radius:10px;border:1px solid var(--ln);background:none;color:var(--mu);cursor:pointer;font-size:15px}.tabs .on{background:var(--cyd);color:var(--cy);border-color:var(--cy)}
.q h3{font-size:20px;line-height:1.3;margin:10px 0 14px}.op{display:flex;gap:12px;width:100%;text-align:left;background:var(--s2);color:var(--tx);border:1.5px solid var(--ln);border-radius:12px;padding:12px 14px;margin-bottom:9px;font:500 15px/1.4 Barlow,sans-serif;cursor:pointer}
.op span{font:600 15px "Chakra Petch";color:var(--cy);min-width:16px}.op:hover:not(:disabled){border-color:var(--cy)}.op.ok{border-color:var(--cy);background:var(--cyd)}.op.no{border-color:var(--no);background:#2A1214}.op.no span{color:var(--no)}
.fb{background:var(--s2);border:1px solid var(--ln);border-radius:12px;padding:12px 14px;margin-top:4px}.fb .h{font-size:17px}.lnk{background:none;border:0;color:var(--cy);padding:0;font-size:15px;text-decoration:underline;cursor:pointer}
.sc{font:700 54px "Chakra Petch";color:var(--cy);margin:4px 0}
</style></head><body><div class="w" id="m"></div>
<script>
const D=[{"n": 1, "t": "Ten Principles of Economics", "pg": "hlm. 1–16", "cards": [["Pengantar: apa itu economics?", "Semua bermula dari satu fakta: sumber daya terbatas.", ["<b>Scarcity</b>: sumber daya masyarakat terbatas, sementara keinginan manusia tak terbatas.", "<b>Economics</b>: studi tentang bagaimana masyarakat mengelola <i>scarce resources</i> itu. Masyarakat harus memutuskan siapa mengerjakan apa dan siapa mendapat apa.", "Ekonom mempelajari bagaimana orang memutuskan (kerja, belanja, menabung), bagaimana mereka berinteraksi, dan kekuatan yang memengaruhi ekonomi secara keseluruhan.", "Isi bab ini: <b>Ten Principles of Economics</b>, terbagi tiga: (1) bagaimana orang membuat keputusan, (2) bagaimana orang berinteraksi, (3) bagaimana ekonomi bekerja secara keseluruhan.", "Prinsip-prinsip ini akan muncul terus di seluruh buku."]], ["Principle 1: People face trade-offs", "Kelompok 1: keputusan individu.", ["Pepatah <i>“There is no such thing as a free lunch”</i>: mendapat satu hal biasanya berarti melepas hal lain.", "Contoh individu: waktu belajar vs waktu bersama teman; uang untuk liburan vs ditabung.", "Contoh keluarga: pendapatan dibagi untuk makanan, pakaian, liburan, dan siapa yang mendapat apa.", "Contoh masyarakat: <i>guns and butter</i> (belanja pertahanan vs barang konsumsi), serta kebersihan lingkungan vs pendapatan.", "<b>Efficiency</b>: masyarakat mendapat hasil maksimal dari scarce resources-nya. <b>Equality</b>: manfaat ekonomi didistribusikan merata di antara anggota masyarakat.", "Efficiency vs equality adalah trade-off: kebijakan yang membagi “kue” lebih merata (pajak, bantuan) sering mengurangi insentif bekerja, sehingga kuenya mengecil.", "Mengenali trade-off tidak memberi tahu pilihan mana yang benar, hanya membantu memilih dengan sadar."]], ["Principle 2: The cost of something is what you give up to get it", "Karena ada trade-off, orang harus membandingkan biaya dan manfaat tiap opsi.", ["Biaya tidak selalu jelas, jadi hitung semua yang dikorbankan.", "<b>Opportunity cost</b> = segala sesuatu yang harus dikorbankan untuk mendapatkan sesuatu.", "Contoh kuliah: biaya terbesarnya adalah upah yang hilang karena tidak bekerja, bukan hanya uang kuliah.", "Contoh nonton bioskop: harga tiket plus jajan plus <b>nilai waktumu</b>. Opportunity cost-nya tidak nol walau kamu menikmatinya.", "Pembuat keputusan rasional memasukkan opportunity cost ke dalam hitungannya."]], ["Principle 3: Rational people think at the margin", "Bagaimana orang memutuskan: lewat perubahan kecil.", ["<b>Rational people</b>: secara sistematis dan sengaja melakukan yang terbaik untuk mencapai tujuan, dengan peluang yang ada.", "<b>Marginal change</b>: penyesuaian kecil bertahap pada rencana yang sudah ada. Keputusan dibuat dengan membandingkan <i>marginal benefit</i> dan <i>marginal cost</i>.", "Aturannya: ambil tindakan hanya bila marginal benefit lebih besar dari marginal cost.", "Contoh maskapai: kursi kosong yang dijual murah tetap untung jika harga tiketnya di atas marginal cost (menambah satu penumpang hampir tak menambah biaya).", "<b>Diamond–water paradox</b>: air vital tetapi murah, berlian tidak vital tetapi mahal. Orang menilai satu unit tambahan: air melimpah sehingga marginal benefit segelas tambahan kecil; berlian langka sehingga marginal benefit-nya besar."]], ["Principle 4: People respond to incentives", "Rational people menanggapi perubahan biaya dan manfaat.", ["<b>Incentive</b> = sesuatu yang mendorong orang bertindak, misalnya hadiah atau hukuman.", "Karena orang membandingkan cost dan benefit, perubahan insentif mengubah perilaku.", "Contoh: harga apel naik, orang beralih ke pir; harga bensin naik, orang memilih mobil lebih kecil atau carpool.", "Harga adalah insentif utama di pasar, karena membuat pembeli dan penjual menimbang manfaat dan biaya.", "Pembuat kebijakan harus memperhitungkan insentif, sebab kebijakan sering membawa <b>unintended consequences</b> (efek yang tidak dimaksudkan)."]], ["Principle 5: Trade can make everyone better off", "Kelompok 2: bagaimana orang berinteraksi.", ["Perdagangan bukan seperti pertandingan olahraga di mana satu pihak menang dan yang lain kalah.", "Dengan trade, setiap orang bisa berspesialisasi pada hal yang paling ia kuasai, lalu menukarnya dengan barang lain.", "Hasilnya: masyarakat menikmati barang dan jasa lebih banyak dan lebih beragam.", "Berlaku untuk keluarga maupun negara. Negara yang berdagang tetap bersaing, tetapi keduanya bisa untung.", "Penjelasan lengkapnya (comparative advantage) ada di Bab 3."]], ["Principle 6: Markets are usually a good way to organize economic activity", "Pasar dan tangan tak terlihat.", ["<b>Market economy</b>: ekonomi yang mengalokasikan sumber daya lewat keputusan terdesentralisasi jutaan rumah tangga dan perusahaan yang berinteraksi di pasar.", "Mereka dipandu oleh <b>harga</b> dan kepentingan pribadi masing-masing.", "Dulu beberapa negara memakai <i>central planning</i>: perencana pemerintah memutuskan barang apa yang diproduksi, berapa banyak, dan siapa yang memproduksi dan mengonsumsinya. Sebagian besar negara itu kini sudah meninggalkannya.", "<b>Invisible hand</b> (Adam Smith, <i>The Wealth of Nations</i>): rumah tangga dan perusahaan yang mengejar kepentingan sendiri seolah dituntun tangan tak terlihat menuju kesejahteraan ekonomi umum.", "Harga mencerminkan nilai suatu barang bagi pembeli dan biaya pembuatannya bagi penjual. Itu sebabnya kebijakan yang mengubah harga (misalnya pajak) mengganggu cara tangan tak terlihat mengoordinasi."]], ["Principle 7: Governments can sometimes improve market outcomes", "Kenapa pasar butuh pemerintah.", ["<b>Property rights</b>: kemampuan seseorang memiliki dan mengendalikan sumber daya langka. Pasar butuh polisi dan pengadilan untuk menegakkannya; kalau hasil panen bisa dicuri, petani tak mau menanam.", "<b>Market failure</b>: situasi saat pasar sendiri gagal mengalokasikan sumber daya secara efisien.", "Penyebab 1: <b>externality</b> = dampak tindakan satu orang pada kesejahteraan orang lain (contoh: polusi dari pabrik).", "Penyebab 2: <b>market power</b> = kemampuan satu orang atau perusahaan memengaruhi harga pasar secara substansial (contoh: satu pelaku yang menguasai pasar sehingga bisa menetapkan harga).", "Pemerintah juga bisa mengejar equality bila hasil pasar dianggap terlalu timpang.", "Catatan: pemerintah dijalankan orang yang tak sempurna, jadi intervensi tidak selalu berhasil."]], ["Principle 8: A country’s standard of living depends on its ability to produce goods and services", "Kelompok 3: ekonomi secara keseluruhan.", ["Perbedaan standar hidup antar negara sangat besar. Data buku untuk 2017: rata-rata orang Amerika berpenghasilan sekitar $60.000, Jerman $51.000, Tiongkok $17.000, dan Nigeria hanya $6.000.", "<b>Productivity</b> = jumlah barang dan jasa yang dihasilkan dari setiap unit input tenaga kerja.", "Negara dengan produktivitas tinggi hidup lebih baik; pertumbuhan produktivitas menaikkan standar hidup.", "Konsekuensi kebijakan: untuk meningkatkan standar hidup, fokus pada cara meningkatkan produktivitas (pendidikan, peralatan, teknologi), bukan hal lain."]], ["Principle 9: Prices rise when the government prints too much money", "Sumber inflasi.", ["<b>Inflation</b> = kenaikan harga secara keseluruhan di dalam ekonomi.", "Contoh sejarah dari buku: Januari 1921 koran harian di Jerman harganya 0,30 mark; November 1922 harganya 70.000.000 mark, dan harga-harga lain naik serupa.", "Penyebab inflasi tinggi yang berkelanjutan umumnya: pertumbuhan <i>quantity of money</i> yang berlebihan.", "Saat pemerintah mencetak banyak uang, nilai uang turun, sehingga harga naik.", "Maka bank sentral yang menjaga pertumbuhan uang terkendali akan menjaga inflasi rendah."]], ["Principle 10: Society faces a short-run trade-off between inflation and unemployment", "Dampak jangka pendek kebijakan moneter.", ["Menambah jumlah uang beredar menaikkan belanja masyarakat, sehingga demand naik.", "Permintaan tinggi mendorong perusahaan menaikkan harga, tetapi juga menambah produksi dan merekrut pekerja: inflasi naik, pengangguran turun.", "Sebaliknya, kebijakan moneter yang menekan demand menurunkan inflasi tetapi menaikkan pengangguran dalam jangka pendek.", "Trade-off ini hanya berlaku jangka pendek, dan penting untuk memahami <b>business cycle</b>.", "<b>Business cycle</b>: fluktuasi aktivitas ekonomi seperti lapangan kerja dan produksi; tidak teratur dan sulit diprediksi."]], ["Rekap: Ten Principles", "Ringkasan sekali baca.", ["<b>Individu:</b> 1. Trade-offs. 2. Biaya = opportunity cost. 3. Berpikir di margin. 4. Respons terhadap incentives.", "<b>Interaksi:</b> 5. Trade menguntungkan semua. 6. Market economy umumnya baik dalam mengoordinasi. 7. Pemerintah kadang memperbaiki pasar (market failure, equality).", "<b>Ekonomi total:</b> 8. Standar hidup ditentukan productivity. 9. Uang berlebih menyebabkan inflation. 10. Trade-off inflation–unemployment jangka pendek."]]], "q": [["Economics is best defined as the study of", ["how society manages its scarce resources.", "how to run a business most profitably.", "how to predict inflation, unemployment, and stock prices.", "how the government can stop the harm from unchecked self-interest."], 0, 0], ["Your opportunity cost of going to a movie is", ["the price of the ticket.", "the price of the ticket plus the cost of any soda and popcorn you buy at the theater.", "the total cash expenditure needed to go to the movie plus the value of your time.", "zero, as long as you enjoy the movie and consider it a worthwhile use of time and money."], 2, 2], ["A marginal change is one that", ["is not important for public policy.", "incrementally alters an existing plan.", "makes an outcome inefficient.", "does not influence incentives."], 1, 3], ["Adam Smith’s “invisible hand” refers to", ["the subtle and often hidden methods that businesses use to profit at consumers’ expense.", "the ability of free markets to reach desirable outcomes, despite the self-interest of market participants.", "the ability of government regulation to benefit consumers even if the consumers are unaware of the regulations.", "the way in which producers or consumers in unregulated markets impose costs on innocent bystanders."], 1, 6], ["If a central bank uses the tools of monetary policy to reduce the demand for goods and services, the likely result is ____ inflation and ____ unemployment in the short run.", ["lower; lower", "lower; higher", "higher; higher", "higher; lower"], 1, 10]]}, {"n": 2, "t": "Thinking Like an Economist", "pg": "hlm. 17–33", "cards": [["Economist sebagai ilmuwan", "Bab ini: cara berpikir ekonom.", ["Ekonom berusaha objektif seperti ilmuwan lain.", "<b>Scientific method</b>: mengembangkan dan menguji teori tentang cara kerja dunia secara dingin dan objektif: observasi, teori, observasi lagi.", "Ekonom sulit bereksperimen di laboratorium, jadi mereka banyak memakai data sejarah dan peristiwa nyata."]], ["Peran assumptions", "Menyederhanakan supaya fokus.", ["<b>Assumptions</b>: pernyataan yang disederhanakan agar masalah lebih mudah dipahami.", "Analogi fisikawan: mempelajari kelereng jatuh dengan mengabaikan gesekan udara. Ekonom juga mengabaikan detail yang tak relevan.", "Contoh pada model berikutnya (PPF): ekonomi diasumsikan hanya memproduksi dua barang.", "Asumsi yang cocok bisa berbeda untuk pertanyaan yang berbeda (misalnya efek uang beredar dalam jangka pendek vs panjang)."]], ["Economic models", "Alat utama ekonom.", ["<b>Model</b>: representasi sederhana dari suatu aspek ekonomi, biasanya berupa diagram dan persamaan.", "Seperti model plastik tubuh di kelas biologi: sengaja tidak memuat semua otot dan pembuluh darah, agar yang penting terlihat.", "Model yang terlalu realistis justru tak berguna, sebab inti masalahnya tenggelam.", "Dua model pertama yang dipelajari: <b>circular-flow diagram</b> dan <b>production possibilities frontier</b>."]], ["Model 1: Siapa saja pelakunya?", "Circular-flow diagram, bagian 1.", ["<b>Circular-flow diagram</b>: model visual ekonomi yang menunjukkan aliran uang antara rumah tangga dan perusahaan lewat pasar.", "Hanya dua pelaku keputusan: <b>firms</b> (memproduksi barang dan jasa) dan <b>households</b> (mengonsumsinya).", "<b>Factors of production</b>: input produksi, yaitu labor, land, dan capital (gedung dan mesin).", "Dua jenis pasar: <b>markets for goods and services</b> dan <b>markets for the factors of production</b>."]], ["Model 1: Membaca diagramnya", "Circular-flow diagram, bagian 2.", ["Pasar barang dan jasa: <b>firms = sellers</b>, <b>households = buyers</b>.", "Pasar faktor produksi: <b>households = sellers</b> (menjual tenaga kerja, tanah, modal), <b>firms = buyers</b> (mempekerjakan dan memakai faktor itu).", "Lingkaran luar = aliran <i>dollars</i>: spending dan revenue di pasar barang; wages, rent, dan profit di pasar faktor.", "Lingkaran dalam = aliran <i>inputs and outputs</i>, berlawanan arah dengan uang: barang dan jasa ke household, labor/land/capital ke firms.", "Kekurangan: model ini sangat sederhana (tanpa pemerintah, tanpa perdagangan internasional)."], "c", "Gambar 1, hlm. 20"], ["Model 2: PPF dan jenis titiknya", "Production possibilities frontier, bagian 1.", ["<b>Production possibilities frontier (PPF)</b>: grafik kombinasi output maksimum yang bisa diproduksi ekonomi, dengan sumber daya dan teknologi yang tersedia. Contoh buku: mobil dan komputer.", "Asumsi: hanya dua barang, dan sumber daya bisa dibagi di antara keduanya.", "Titik <b>pada</b> kurva (A, B) = efisien: tak ada cara menambah satu barang tanpa mengurangi yang lain.", "Titik <b>di dalam</b> kurva (D) = <b>inefficient</b> tetapi <b>feasible</b> (bisa dicapai). Contoh penyebab: pengangguran luas. D: 300 mobil + 1.000 komputer, sedangkan A: 600 mobil + 2.200 komputer.", "Titik <b>di luar</b> kurva (C) = <b>not feasible</b>, sebab sumber daya tidak cukup."], "p", "Gambar 2, hlm. 22"], ["PPF: trade-off dan opportunity cost", "Production possibilities frontier, bagian 2.", ["Pindah sepanjang kurva = trade-off: dari A ke B, produksi mobil naik 100 sementara komputer turun 200.", "Jadi di titik A, opportunity cost 100 mobil = 200 komputer, atau <b>1 mobil = 2 komputer</b>.", "Opportunity cost mobil = <b>slope</b> (kemiringan) PPF.", "Opportunity cost tidak konstan, itu sebabnya kurva <b>bowed outward</b> (melengkung keluar).", "Titik E (banyak mobil, sedikit komputer): kurva curam, opportunity cost mobil tinggi karena pekerja terbaik pembuat mobil sudah bekerja di sana.", "Titik F (sedikit mobil, banyak komputer): kurva landai, opportunity cost mobil rendah karena pekerja yang dipindah pandai membuat mobil, sehingga komputer hanya berkurang sedikit."]], ["PPF: pergeseran dan pertumbuhan", "Production possibilities frontier, bagian 3.", ["PPF menunjukkan trade-off pada satu waktu, tetapi bisa berubah seiring waktu.", "Contoh: kemajuan teknologi di industri komputer. Untuk jumlah mobil yang sama, ekonomi kini bisa membuat lebih banyak komputer, jadi PPF <b>bergeser keluar</b>.", "Ujung kurva di sumbu mobil tidak berubah (1.000 mobil jika tidak membuat komputer).", "Ini menggambarkan <b>economic growth</b>. Dari A ke G: mobil 600 → 650, komputer 2.200 → 2.300.", "Titik mana yang dipilih bergantung pada preferensi masyarakat terhadap kedua barang.", "PPF menyederhanakan ekonomi untuk menunjukkan scarcity, efficiency, trade-off, opportunity cost, dan growth sekaligus."], "s", "Gambar 3, hlm. 24"], ["Microeconomics vs macroeconomics", "Dua cabang ilmu ekonomi.", ["<b>Microeconomics</b>: studi tentang bagaimana rumah tangga dan perusahaan membuat keputusan dan berinteraksi di pasar tertentu.", "<b>Macroeconomics</b>: studi tentang fenomena seluruh ekonomi, termasuk inflasi, pengangguran, dan pertumbuhan.", "Contoh micro: dampak rent control di New York, persaingan impor terhadap industri mobil AS, efek pendidikan pada upah.", "Contoh macro: efek pinjaman pemerintah federal, perubahan tingkat pengangguran, kebijakan pendorong pertumbuhan.", "Keduanya saling terkait (ekonomi adalah jumlah keputusan banyak pasar), tetapi berbeda pertanyaannya, sehingga biasanya diajarkan terpisah."]], ["Positive vs normative statements", "Ekonom punya dua peran: ilmuwan dan penasihat kebijakan.", ["Saat menjelaskan dunia, ekonom bertindak sebagai <i>ilmuwan</i>. Saat berusaha memperbaikinya, mereka bertindak sebagai <i>policy adviser</i>.", "<b>Positive statements</b>: pernyataan tentang dunia <i>apa adanya</i>. Bisa dinilai benar atau salah dengan data.", "<b>Normative statements</b>: pernyataan tentang bagaimana dunia <i>seharusnya</i>. Butuh penilaian nilai, tidak sekadar fakta.", "Contoh dalam buku: “Minimum-wage laws cause unemployment” = positive. “The government should raise the minimum wage” = normative.", "Positive statement bisa saja salah, dan tetap positive.", "Tips: kata <i>should, ought</i>, atau penilaian baik/buruk menandakan normatif."]], ["Economists in Washington", "Ekonom sebagai penasihat.", ["Sejak 1946, presiden AS dinasihati <b>Council of Economic Advisers</b> (tiga anggota dan puluhan staf ekonom) yang tugasnya menasihati presiden dan menulis <i>Economic Report of the President</i> tiap tahun.", "Ekonom juga bekerja di Treasury, Office of Management and Budget, Department of Labor, Department of Justice (misalnya persaingan usaha), dan lembaga lain.", "Peran ini tetap harus memisahkan fakta (positive) dari nilai (normative)."]], ["Mengapa ekonom berbeda pendapat", "Dua alasan dasar.", ["<b>Scientific judgments</b>: ekonom berbeda pendapat soal validitas teori positif atau besar parameter penting (seperti astronom dulu berdebat soal pusat tata surya).", "<b>Differences in values</b>: ekonom punya nilai berbeda, jadi pandangan normatifnya soal tujuan kebijakan juga berbeda (misalnya soal pajak yang adil).", "Perbedaan ini sering dibesar-besarkan: banyak topik di mana mayoritas ekonom sepakat, misalnya <b>tariffs</b> umumnya dinilai cara yang buruk untuk meningkatkan kesejahteraan umum.", "Kadang ekonom sepakat tetapi pembuat kebijakan tetap mengabaikan saran karena politik."]]], "q": [["An economic model is", ["a mechanical machine that replicates the functioning of the economy.", "a fully detailed, realistic description of the economy.", "a simplified representation of some aspect of the economy.", "a computer program that predicts the future of the economy."], 2, 2], ["The circular-flow diagram illustrates that, in markets for the factors of production,", ["households are sellers, and firms are buyers.", "households are buyers, and firms are sellers.", "households and firms are both buyers.", "households and firms are both sellers."], 0, 4], ["A point inside the production possibilities frontier is", ["efficient but not feasible.", "feasible but not efficient.", "both efficient and feasible.", "neither efficient nor feasible."], 1, 5], ["Which of the following is a positive, rather than a normative, statement?", ["Law X will reduce national income.", "Law X is a good piece of legislation.", "Congress ought to pass law X.", "The president should veto law X."], 0, 9]]}, {"n": 3, "t": "Interdependence and the Gains from Trade", "pg": "hlm. 45–56", "cards": [["Interdependence dan trade", "Bab ini menjelaskan kenapa trade menguntungkan.", ["Hampir semua yang kamu pakai atau makan dibuat banyak orang, di dalam dan luar negeri.", "<b>Interdependence</b> dan trade membuat semua orang menikmati barang dan jasa lebih banyak dan lebih beragam.", "Untuk melihat alasannya, buku memakai dongeng sederhana: dua orang dan dua barang."]], ["Perumpamaan: Frank dan Ruby", "Setup kasus.", ["Hanya dua barang: <b>meat</b> dan <b>potatoes</b>. Hanya dua orang: <b>Frank</b> (petani, bisa menanam kentang) dan <b>Ruby</b> (peternak, bisa memelihara sapi).", "Ruby bisa membuat keduanya, dan ia lebih jago di keduanya.", "Keduanya bekerja 8 jam per hari, dan masing-masing ingin makan daging dan kentang.", "Pertanyaan utama: apakah mereka sebaiknya berdagang? Dan jika Ruby lebih baik di segalanya, apa yang bisa Frank tawarkan?"]], ["Production opportunities", "Berapa yang bisa dibuat masing-masing.", ["Waktu per ounce. Frank: meat 60 menit, potatoes 15 menit. Ruby: meat 20 menit, potatoes 10 menit.", "Jika 8 jam dipakai untuk satu barang saja: Frank 8 oz meat atau 32 oz potatoes. Ruby 24 oz meat atau 48 oz potatoes.", "Setiap orang punya PPF sendiri, dan karena opportunity cost-nya konstan, PPF-nya <b>garis lurus</b>.", "Tanpa trade, PPF juga menjadi batas konsumsi mereka."], "t", "Gambar 1, hlm. 47"], ["Sebelum trade", "Konsumsi sama dengan produksi.", ["Tanpa trade, masing-masing hanya mengonsumsi apa yang ia produksi sendiri.", "Jadi konsumsi masing-masing berada <b>pada</b> PPF sendiri.", "Pilihan Frank (titik A): 16 oz potatoes + 4 oz meat.", "Pilihan Ruby (titik B): 24 oz potatoes + 12 oz meat.", "Pilihan ini tergantung selera, bukan hanya kemampuan."]], ["Specialization dan trade", "Tawaran Ruby.", ["Ruby mengusulkan: Frank berhenti memelihara sapi, menanam kentang penuh 8 jam (32 oz potatoes), lalu menukar 15 oz kentang dengan 5 oz daging Ruby.", "Hasil untuk Frank: 17 oz potatoes + 5 oz meat (dulu 16 + 4), lebih banyak keduanya.", "Ruby memakai 6 jam untuk sapi (18 oz meat) dan 2 jam untuk kentang (12 oz potatoes). Setelah tukar: 13 oz meat + 27 oz potatoes (dulu 12 + 24).", "Setelah trade, konsumsi tiap orang berada <b>di luar</b> PPF-nya sendiri.", "Trade tidak menambah sumber daya, tetapi spesialisasi membuat total produksi lebih besar sehingga kedua pihak untung."]], ["Absolute advantage", "Siapa lebih produktif?", ["<b>Absolute advantage</b>: kemampuan memproduksi barang dengan <b>input lebih sedikit</b> daripada produsen lain.", "Cara cek: bandingkan waktu atau input per unit barang (yang lebih sedikit menang).", "Ruby punya absolute advantage di meat (20 vs 60 menit) dan potatoes (10 vs 15 menit).", "Karena itu muncul teka-teki: kalau Ruby unggul di semuanya, bagaimana Frank bisa berspesialisasi?", "Jawabannya bukan absolute advantage, melainkan comparative advantage."]], ["Comparative advantage", "Kunci seluruh bab.", ["<b>Comparative advantage</b>: kemampuan memproduksi barang dengan <b>opportunity cost lebih rendah</b>.", "Langkah: (1) hitung opportunity cost tiap barang untuk tiap orang, (2) bandingkan, (3) yang opportunity cost-nya lebih rendah punya comparative advantage.", "Frank: 1 oz meat = 60/15 = 4 oz potatoes. Ruby: 1 oz meat = 20/10 = 2 oz potatoes. <b>Ruby</b> unggul komparatif di meat.", "Frank: 1 oz potatoes = 1/4 oz meat. Ruby: 1 oz potatoes = 1/2 oz meat. <b>Frank</b> unggul komparatif di potatoes.", "Opportunity cost kedua barang saling berkebalikan, sehingga satu orang tidak mungkin unggul komparatif di keduanya.", "Satu pihak bisa unggul absolut di semuanya, tetapi tak mungkin unggul komparatif di semuanya."]], ["Comparative advantage dan gains from trade", "Aturan praktis.", ["<b>Gains from trade</b> (keuntungan dari perdagangan) muncul karena tiap pihak berspesialisasi pada barang yang punya comparative advantage-nya.", "Harga tukar harus berada <b>di antara</b> opportunity cost kedua pihak (kentang: antara 1/4 dan 1/2 oz daging).", "Jika opportunity cost <b>sama</b> bagi kedua pihak, tidak ada gains from trade.", "Dasar keuntungan trade adalah comparative advantage, bukan absolute advantage."]], ["Berlaku untuk negara", "Bukan cuma antar orang.", ["Prinsip yang sama berlaku antar negara: negara cenderung mengekspor barang yang punya comparative advantage-nya dan mengimpor yang tidak.", "Ini dasar argumen ekonom untuk <b>free trade</b> antar negara.", "Trade menguntungkan negara secara keseluruhan, walau dampaknya bisa berbeda antar kelompok.", "Seperti Ruby dan Frank, negara yang kurang produktif di semua barang tetap punya comparative advantage di sesuatu, sehingga tetap bisa untung dari trade."]]], "q": [["Before Frank and Ruby engage in trade, each of them", ["consumes at a point inside his or her production possibilities frontier.", "consumes at a point on his or her production possibilities frontier.", "consumes at a point outside his or her production possibilities frontier.", "consumes the same amounts of meat and potatoes as the other."], 1, 3], ["In an hour, Mateo can wash 2 cars or mow 1 lawn, and Sophia can wash 3 cars or mow 1 lawn. Who has the absolute advantage in car washing, and who has the absolute advantage in lawn mowing?", ["Mateo in washing, Sophia in mowing", "Sophia in washing, Mateo in mowing", "Mateo in washing, neither in mowing", "Sophia in washing, neither in mowing"], 3, 5], ["Between Mateo and Sophia, who has the comparative advantage in car washing, and who has the comparative advantage in lawn mowing?", ["Mateo in washing, Sophia in mowing", "Sophia in washing, Mateo in mowing", "Mateo in washing, neither in mowing", "Sophia in washing, neither in mowing"], 1, 6], ["Kayla can cook dinner in 30 minutes and wash the laundry in 20 minutes. Her roommate takes twice as long to do each task. How should the roommates allocate the work?", ["Kayla should do more of the cooking based on her comparative advantage.", "Kayla should do more of the washing based on her comparative advantage.", "Kayla should do more of the washing based on her absolute advantage.", "There are no gains from trade in this situation."], 3, 7]]}, {"n": 4, "t": "The Market Forces of Supply and Demand", "pg": "hlm. 61–82", "cards": [["Pengantar: supply dan demand", "Dua kata yang paling sering dipakai ekonom.", ["Supply dan demand adalah kekuatan yang membuat market economy bekerja.", "Keduanya menentukan <b>jumlah</b> tiap barang yang diproduksi dan <b>harga</b> jual barang itu.", "Contoh dari buku: cuaca dingin di Florida menaikkan harga jus jeruk; perang di Timur Tengah menaikkan harga bensin.", "Untuk menilai dampak suatu peristiwa atau kebijakan, pertama tanyakan bagaimana efeknya pada supply dan demand.", "Bab ini: bagaimana pembeli dan penjual berperilaku dan berinteraksi, bagaimana harga terbentuk, dan bagaimana harga mengalokasikan sumber daya langka."]], ["Market dan competition", "Dua istilah dasar.", ["<b>Market</b>: sekelompok pembeli dan penjual suatu barang atau jasa. Pembeli sebagai kelompok menentukan <b>demand</b>, penjual sebagai kelompok menentukan <b>supply</b>.", "Ada pasar yang sangat terorganisir (komoditas pertanian: gandum, jagung, dengan auctioneer yang mencari harga penyeimbang), dan ada yang longgar (es krim di sebuah kota: tiap penjual memasang harga sendiri).", "<b>Competitive market</b>: pasar dengan begitu banyak pembeli dan penjual sehingga masing-masing berpengaruh sangat kecil pada harga pasar.", "Akibatnya, harga dan jumlah tidak ditentukan satu pembeli atau penjual, melainkan semua pelaku yang berinteraksi."]], ["Perfect competition dan monopoly", "Asumsi yang dipakai di bab ini.", ["<b>Perfectly competitive market</b> punya dua ciri: (1) barang yang dijual persis sama, (2) pembeli dan penjual begitu banyak sehingga tak ada yang bisa memengaruhi harga.", "Pelaku seperti ini disebut <b>price takers</b>: harus menerima harga pasar. Pada harga itu pembeli bisa beli sebanyak yang mereka mau, dan penjual bisa menjual sebanyak yang mereka mau.", "Contoh yang mendekati: pasar gandum (ribuan petani, jutaan konsumen).", "<b>Monopoly</b>: pasar dengan hanya satu penjual yang menetapkan harga, misalnya TV kabel lokal dengan satu perusahaan.", "Banyak pasar ada di antara dua ekstrem itu. Asumsi persaingan sempurna tetap berguna sebagai titik awal, dan banyak pelajarannya berlaku di pasar yang lebih rumit."]], ["Demand: quantity demanded dan law of demand", "Perilaku pembeli.", ["<b>Quantity demanded</b>: jumlah barang yang pembeli <i>mau dan mampu</i> beli.", "<b>Law of demand</b>: ceteris paribus (hal lain tetap), saat harga naik quantity demanded turun, saat harga turun quantity demanded naik.", "<b>Demand schedule</b>: tabel hubungan harga dan quantity demanded. <b>Demand curve</b>: grafik dari tabel itu, dengan harga di sumbu vertikal dan quantity di horizontal.", "Demand curve miring ke bawah karena harga lebih rendah berarti quantity demanded lebih besar.", "Contoh Catherine: kerucut gratis = 12 per bulan; $1 = 10; $4 = 4; di $6 = 0."], "d1", "Gambar 1, hlm. 64"], ["Market demand vs individual demand", "Dari satu orang ke seluruh pasar.", ["<b>Market demand</b>: jumlah semua individual demand untuk suatu barang.", "Pada setiap harga, quantity demanded pasar = jumlah quantity demanded semua pembeli.", "Contoh: pada harga $4, Catherine membeli 4 kerucut dan Nicholas 3, sehingga market demand 7.", "Secara grafik, individual demand curve dijumlahkan <b>secara horizontal</b> (menjumlah sumbu quantity).", "Market demand curve menunjukkan bagaimana total quantity demanded berubah mengikuti harga, dengan faktor lain tetap."]], ["Shifts in the demand curve", "Kalau yang berubah bukan harga.", ["Demand curve memegang faktor lain tetap, jadi bisa <b>bergeser</b> jika ada yang mengubah quantity demanded pada harga tertentu.", "Contoh: jika riset menemukan es krim membuat orang berumur panjang, quantity demanded di setiap harga naik.", "<b>Increase in demand</b>: kurva bergeser ke kanan (quantity demanded naik di setiap harga). <b>Decrease in demand</b>: kurva bergeser ke kiri.", "Kurva bergeser bila berubah variabel yang tidak ada di kedua sumbu. Harga ada di sumbu, jadi perubahan harga = <b>pergerakan sepanjang kurva</b> (change in quantity demanded), bukan shift."], "d3", "Gambar 3, hlm. 66"], ["Penyebab shift demand (1): income dan related goods", "Dari lima faktor, dua pertama.", ["<b>Income</b>: bila income turun, demand untuk kebanyakan barang turun. Barang yang demand-nya turun saat income turun disebut <b>normal good</b>.", "<b>Inferior good</b>: demand justru naik saat income turun. Contoh buku: bus (kalau income turun, orang pindah dari mobil atau taksi ke bus).", "<b>Prices of related goods</b>: ada dua jenis hubungan.", "<b>Substitutes</b>: kalau harga barang A turun, demand barang B turun (dipakai saling mengganti). Contoh: hot dog dan hamburger, es krim dan frozen yogurt.", "<b>Complements</b>: kalau harga barang A turun, demand barang B naik (dipakai bersama). Contoh: es krim dan hot fudge, bensin dan mobil.", "Kalau harga <b>substitute naik</b>, demand barangmu bergeser ke kanan; kalau harga <b>complement naik</b>, demand bergeser ke kiri."]], ["Penyebab shift demand (2): tastes, expectations, number of buyers", "Tiga faktor lainnya, plus aturan baku.", ["<b>Tastes</b>: selera. Ekonom biasanya tidak menjelaskan asal selera (itu ranah sejarah dan psikologi), tetapi menelaah dampak perubahan selera.", "<b>Expectations</b>: ekspektasi masa depan memengaruhi demand hari ini. Contoh: berharap income naik bulan depan membuat kamu belanja lebih hari ini; berharap harga turun besok membuatmu menunda membeli.", "<b>Number of buyers</b>: tambahan pembeli menaikkan market demand.", "Ringkas (Table 1): perubahan <b>harga barang itu</b> = pergerakan sepanjang kurva; perubahan income, harga related goods, tastes, expectations, dan number of buyers = <b>shift</b> kurva."], "t1", "Table 1, hlm. 67"], ["Kasus: dua cara mengurangi merokok", "Shift vs pergerakan dalam kebijakan.", ["Cara 1: menggeser demand curve ke kiri lewat iklan layanan masyarakat, peringatan kesehatan di bungkus, larangan iklan rokok di TV.", "Cara 2: menaikkan harga, misalnya pajak produksi rokok yang diteruskan produsen ke konsumen lewat harga lebih tinggi. Ini <b>pergerakan sepanjang kurva</b> yang sama, bukan shift.", "Ekonom meneliti respons terhadap harga lewat perubahan pajak rokok; menurut studi dalam buku, kenaikan harga rokok 10% menurunkan merokok di kalangan remaja sekitar 12%."]], ["Supply: quantity supplied dan law of supply", "Perilaku penjual.", ["<b>Quantity supplied</b>: jumlah yang penjual <i>mau dan mampu</i> jual.", "Harga tinggi membuat berjualan lebih menguntungkan, sehingga quantity supplied besar (penjual bekerja lebih lama, membeli lebih banyak mesin, merekrut).", "<b>Law of supply</b>: ceteris paribus, saat harga naik quantity supplied naik, saat harga turun quantity supplied turun.", "<b>Supply schedule</b>: tabel harga dan quantity supplied. <b>Supply curve</b>: grafiknya, miring ke atas.", "<b>Market supply</b> = jumlah supply semua penjual. Contoh: pada $4, Ben menjual 3 dan Jerry 4, jadi market supply 7 kerucut. Kurva dijumlahkan secara horizontal."]], ["Shifts in the supply curve", "Kalau yang berubah bukan harga.", ["<b>Increase in supply</b>: supply curve bergeser ke kanan (penjual mau jual lebih banyak di setiap harga). <b>Decrease in supply</b>: bergeser ke kiri.", "<b>Input prices</b>: bahan baku, tenaga kerja, mesin. Harga input turun membuat produksi lebih menguntungkan, jadi supply naik. Harga input naik, supply turun.", "<b>Technology</b>: teknologi yang menurunkan biaya meningkatkan supply.", "<b>Expectations</b>: jika penjual memperkirakan harga naik di masa depan, ia mungkin menahan sebagian barang sekarang, sehingga supply hari ini turun.", "<b>Number of sellers</b>: tambahan penjual menaikkan market supply.", "Aturan sama: perubahan harga barang itu sendiri = <b>pergerakan sepanjang kurva</b> (change in quantity supplied). Perubahan faktor lain = shift (change in supply)."], "s7", "Gambar 7, hlm. 72"], ["Equilibrium", "Supply dan demand bertemu.", ["<b>Equilibrium</b>: titik di mana supply curve dan demand curve berpotongan.", "<b>Equilibrium price</b> (disebut juga <i>market-clearing price</i>): harga yang menyeimbangkan quantity supplied dan quantity demanded.", "<b>Equilibrium quantity</b>: jumlah pada harga itu.", "Contoh es krim: equilibrium price $4, equilibrium quantity 7 kerucut. Pada $4, pembeli ingin beli 7 dan penjual ingin jual 7.", "Pada harga ini, tiap pembeli dan penjual puas, sehingga tak ada dorongan untuk mengubah perilaku."], "e8", "Gambar 8, hlm. 74"], ["Jika harga tidak di equilibrium", "Surplus dan shortage.", ["<b>Surplus</b> (excess supply): quantity supplied lebih besar dari quantity demanded. Contoh: pada $5, penjual ingin jual 10 tapi pembeli hanya mau beli 4.", "Saat surplus, penjual menurunkan harga untuk mengurangi persediaan, sehingga harga turun menuju equilibrium.", "<b>Shortage</b> (excess demand): quantity demanded lebih besar dari quantity supplied. Contoh: pada $3, pembeli ingin 10 tapi penjual hanya menyediakan 4.", "Saat shortage, penjual bisa menaikkan harga tanpa kehilangan pembeli, sehingga harga naik menuju equilibrium.", "Kecepatan penyesuaian berbeda antar pasar, tetapi di pasar bebas kelebihan dan kekurangan bersifat sementara."]], ["Law of supply and demand", "Aturan umumnya.", ["<b>Law of supply and demand</b>: harga suatu barang menyesuaikan diri sampai quantity supplied dan quantity demanded seimbang.", "Di bawah harga equilibrium terjadi shortage dan harga naik; di atasnya terjadi surplus dan harga turun.", "Harga equilibrium juga yang membuat semua pembeli dan penjual puas, sehingga pasar menjadi alat alokasi sumber daya langka."]], ["Tiga langkah menganalisis perubahan equilibrium", "Langkah standar (Table 3).", ["Langkah 1: tentukan apakah peristiwa menggeser <b>supply curve</b>, <b>demand curve</b>, atau keduanya.", "Langkah 2: tentukan <b>arah</b> shift (ke kanan atau ke kiri).", "Langkah 3: pakai diagram supply-demand untuk melihat bagaimana shift mengubah equilibrium price dan quantity.", "Aturan ringkas: demand naik = harga dan quantity naik; demand turun = harga dan quantity turun; supply naik = harga turun dan quantity naik; supply turun = harga naik dan quantity turun.", "Contoh implikasi: temuan cadangan minyak baru menggeser supply bensin ke kanan, sehingga harga equilibrium turun. Resesi menurunkan income, sehingga demand inferior goods naik (harga dan quantity naik)."]], ["Contoh 1: demand bergeser (cuaca panas)", "Penerapan tiga langkah.", ["Cuaca sangat panas: (1) memengaruhi demand es krim (selera/kondisi pembeli), (2) demand <b>naik</b> (ke kanan), (3) equilibrium berpindah ke harga lebih tinggi dan quantity lebih besar.", "Hasil buku: harga naik dari $4 ke $5 dan quantity naik dari 7 ke 10 kerucut.", "Perhatikan: kenaikan harga menyebabkan <i>pergerakan sepanjang supply curve</i> (change in quantity supplied), sementara supply curve-nya sendiri tidak bergeser."], "e10", "Gambar 10, hlm. 77"], ["Contoh 2: supply bergeser (harga gula naik)", "Badai merusak tebu.", ["Badai menghancurkan tebu dan harga gula naik. Gula adalah <b>input</b> es krim.", "Supply curve es krim bergeser ke <b>kiri</b> (decrease in supply).", "Equilibrium baru: harga naik dari $4 ke $5, quantity turun dari 7 ke 4 kerucut.", "Demand curve tidak bergeser. Kenaikan harga menyebabkan pergerakan sepanjang demand curve (change in quantity demanded).", "Ringkas: <i>shift</i> supply disebut “change in supply”, pergerakan sepanjang supply curve disebut “change in quantity supplied”; hal yang sama berlaku untuk demand."]], ["Contoh 3: supply dan demand bergeser bersamaan", "Kombinasi shift.", ["Jika demand dan supply sama-sama naik: quantity naik pasti, harga tidak pasti (tergantung shift mana yang lebih besar).", "Jika demand naik dan supply turun: harga naik pasti, quantity tidak pasti.", "Jika demand turun dan supply naik: harga turun pasti, quantity tidak pasti.", "Jika keduanya turun: quantity turun pasti, harga tidak pasti.", "Contoh soal Quick Quiz: harga equilibrium jelly naik dan quantity turun berarti supply turun (misalnya harga anggur sebagai input naik)."]], ["Kesimpulan: bagaimana harga mengalokasikan sumber daya", "Inti bab.", ["Supply dan demand bersama menentukan harga di ekonomi, dan harga menjadi sinyal yang memandu alokasi sumber daya.", "Contoh buku: harga tanah tepi pantai menyesuaikan sampai quantity demanded = quantity supplied; siapa yang mendapat tanah itu ditentukan oleh siapa yang mau dan mampu membayar.", "Harga juga menentukan siapa yang bekerja di pertanian dan berapa banyak makanan diproduksi, tanpa perencanaan pusat. Ini adalah <i>invisible hand</i> dari Bab 1."]]], "q": [["The best definition of a market is", ["a store that offers a variety of goods and services.", "a place where buyers meet and an auctioneer calls out prices.", "a group of buyers and sellers of a good or service.", "a venue where the sole supplier of a good offers its product."], 2, 1], ["In a perfectly competitive market,", ["every seller tries to distinguish itself by offering a better product than its rivals.", "every seller takes the price of its product as set by market conditions.", "every seller tries to undercut the prices charged by its rivals.", "one seller has successfully outcompeted its rivals so no other sellers remain."], 1, 2], ["The market for which product best fits the definition of a perfectly competitive market?", ["eggs", "tap water", "movies", "computer operating systems"], 0, 2], ["A change in which of the following will NOT shift the demand curve for hamburgers?", ["the price of hot dogs", "the price of hamburgers", "the price of hamburger buns", "the income of hamburger consumers"], 1, 7], ["Which of the following will shift the demand curve for pizza to the right?", ["an increase in the price of hamburgers, a substitute for pizza", "an increase in the price of root beer, a complement to pizza", "the departure of college students, as they leave for summer vacation", "a decrease in the price of pizza"], 0, 6], ["If pasta is an inferior good, then the demand curve shifts to the _____ when _____ rises.", ["right; the price of pasta", "right; consumers’ income", "left; the price of pasta", "left; consumers’ income"], 3, 6], ["Which of the following moves the pizza market up along a given supply curve?", ["an increase in the price of pizza", "an increase in the price of root beer, a complement to pizza", "a decrease in the price of cheese, an input to pizza", "a kitchen fire that destroys a popular pizza joint"], 0, 9], ["Which of the following shifts the supply curve for pizza to the right?", ["an increase in the price of pizza", "an increase in the price of root beer, a complement to pizza", "a decrease in the price of cheese, an input to pizza", "a kitchen fire that destroys a popular pizza joint"], 2, 10], ["Movie tickets and film streaming services are substitutes. If the price of film streaming increases, what happens in the market for movie tickets?", ["The supply curve shifts to the left.", "The supply curve shifts to the right.", "The demand curve shifts to the left.", "The demand curve shifts to the right."], 3, 6], ["The discovery of a large new reserve of crude oil will shift the _____ curve for gasoline, leading to a _____ equilibrium price.", ["supply; higher", "supply; lower", "demand; higher", "demand; lower"], 1, 14], ["If the economy goes into a recession and incomes fall, what happens in the markets for inferior goods?", ["Prices and quantities both rise.", "Prices and quantities both fall.", "Prices rise and quantities fall.", "Prices fall and quantities rise."], 0, 14], ["Which of the following might lead to an increase in the equilibrium price of jelly and a decrease in the equilibrium quantity of jelly sold?", ["an increase in the price of peanut butter, a complement to jelly", "an increase in the price of Marshmallow Fluff, a substitute for jelly", "an increase in the price of grapes, an input into jelly", "an increase in consumers’ incomes, as long as jelly is a normal good"], 2, 16], ["An increase in _____ will cause a movement along a given supply curve, which is called a change in _____.", ["supply; demand", "supply; quantity demanded", "demand; supply", "demand; quantity supplied"], 3, 10]]}],IMG={"c": "data:image/jpeg;base64,/9j/4AAQSkZJRgABAQAAAQABAAD/2wBDAAkGBwgHBgkIBwgKCgkLDRYPDQwMDRsUFRAWIB0iIiAdHx8kKDQsJCYxJx8fLT0tMTU3Ojo6Iys/RD84QzQ5Ojf/2wBDAQoKCg0MDRoPDxo3JR8lNzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzc3Nzf/wAARCAJrBFQDASIAAhEBAxEB/8QAGwABAAIDAQEAAAAAAAAAAAAAAAQFAQMGAgf/xABaEAABBAEDAgIFBQsGCwcDAQkBAAIDBBEFEiETMQZBFCJRYXEyUoGR0QcVFiMzNkKDobGyU1RVkpTwFyQ0N3KToq const go=(x,c)=>{v=x;if(c!=null){ci=c;bi=0;qi=0;sc=0;ans=null}draw();scrollTo(0,0)};
function hdr(t,back){return `<div class="top"><button class="ic" aria-label="Kembali" onclick="go('${back}')">←</button><div class="t">${t}</div></div>`}
function draw(){const m=document.getElementById('m');let h='';
if(v=='home'){const done=Object.keys(P.best).length;
h=`<div class="top"><div class="logo">ME</div><div class="t h"><b style="color:var(--tx)">Mankiw Economics</b><br>Principles of Economics, 9th ed.</div></div><h1 class="hi">Siap belajar ekonomi?</h1><div class="mu">Baca kartu materi, lalu uji dengan kuis dari buku.</div><div class="st"><div><b>${P.xp}</b>XP</div><div><b>${done}/${D.length}</b>Kuis selesai</div><div><b>36</b>Bab di buku</div></div>`;
D.forEach((c,i)=>{const r=Math.min(P.read[c.n]||0,c.cards.length);h+=`<button class="lc" onclick="go('lesson',${i})"><div class="h">Bab ${c.n}. ${c.t}</div><div class="mu">${c.pg} · ${c.cards.length} kartu · ${c.q.length} soal${P.best[c.n]!=null?' · skor terbaik '+P.best[c.n]+'/'+c.q.length:''}</div><div class="bar"><i style="width:${r/c.cards.length*100}%"></i></div></button>`});
h+=`<div class="lc lk"><div class="h">Bab 5–36</div><div class="mu">Segera hadir</div></div>`}
else if(v=='lesson'){const c=D[ci],k=c.cards[bi];P.read[c.n]=Math.max(P.read[c.n]||0,bi+1);save();
h=hdr('Bab '+c.n+'. '+c.t,'home')+`<div class="bar"><i style="width:${(bi+1)/c.cards.length*100}%"></i></div><div class="card"><div class="mu">Kartu ${bi+1} dari ${c.cards.length}</div><h2>${k[0]}</h2><p class="lead">${k[1]}</p><ul>${k[2].map(x=>`<li>${x}</li>`).join('')}</ul>${k[3]?`<figure><img src="${IMG[k[3]]}" alt="${k[4]}"><figcaption>${k[4]}, dari buku Mankiw</figcaption></figure>`:''}</div><div class="nav"><button class="g" ${bi?'':'disabled'} onclick="bi--;draw();scrollTo(0,0)">Sebelumnya</button>${bi<c.cards.length-1?`<button onclick="bi++;draw();scrollTo(0,0)">Berikutnya</button>`:`<button onclick="go('quiz',${ci})">Mulai kuis</button>`}</div>`}
else{const c=D[ci];

m.innerHTML=h}
